<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden" id="app-container">
        
        <!-- Login View -->
        <div id="login-view" class="p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800">Welcome Back</h1>
                <p class="text-gray-500 mt-2 text-sm">Please sign in to your test account.</p>
            </div>

            <!-- Error Message Box (Hidden by default) -->
            <div id="error-message" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg text-center font-medium">
                Invalid credentials. Please try again.
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        placeholder="e.g. admin">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        placeholder="••••••••">
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors duration-200 flex justify-center items-center">
                    <span>Sign In</span>
                </button>
            </form>
            
            <div class="mt-6 text-center text-xs text-gray-400">
                <p>Test accounts: admin/password123, tester/testpass</p>
            </div>
        </div>
    </div>

    <script>
        // UI Elements
        const loginForm = document.getElementById('login-form');
        const loginView = document.getElementById('login-view');
        const errorMessage = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        // Handle Form Submission
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent page reload
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            
            // Visual feedback for loading
            submitBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Checking...
            `;
            submitBtn.disabled = true;
            errorMessage.classList.add('hidden');

            try {
                // THE "MOCK BACKEND" LOGIC
                let users = [];
                
                try {
                    // 1. Attempt to fetch the users.json file from your GitHub Pages site
                    const response = await fetch('users.json');
                    if (!response.ok) throw new Error("File not found");
                    users = await response.json();
                } catch (fetchError) {
                    // Fallback: If running in a preview environment where the separate users.json 
                    // file can't be fetched, use this hardcoded array so the demo still works.
                    console.log("Could not fetch users.json (expected in preview). Using fallback data.");
                    users = [
                        { "username": "admin", "password": "password123" },
                        { "username": "tester", "password": "testpass" }
                    ];
                }

                // 2. Check if the entered credentials match any user in the database
                const validUser = users.find(
                    user => user.username === usernameInput && user.password === passwordInput
                );

                // Simulate slight network delay for realism
                setTimeout(() => {
                    if (validUser) {
                        // 3a. Success! Redirect to the user's specific dashboard.
                        submitBtn.innerHTML = 'Redirecting...';
                        window.location.href = `${validUser.username}_dashboard.html`;
                    } else {
                        // 3b. Failure! Show error.
                        errorMessage.classList.remove('hidden');
                        // Reset button
                        submitBtn.innerHTML = '<span>Sign In</span>';
                        submitBtn.disabled = false;
                    }
                }, 600); // 600ms fake delay

            } catch (error) {
                console.error("Login Error:", error);
                errorMessage.textContent = "An error occurred checking credentials.";
                errorMessage.classList.remove('hidden');
                submitBtn.innerHTML = '<span>Sign In</span>';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
